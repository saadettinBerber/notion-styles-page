[package]
name = "notion-sayfa"
version = "0.1.0"
edition = "2024"
description = "Convert Markdown into Notion-style HTML pages"
default-run = "notion-page"

[[bin]]
name = "notion-page"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
crc32fast = "1"
gif = "0.14"
image-webp = "0.2"
jpeg-decoder = { version = "0.3", default-features = false }
libyaml-safer = "0.3"
markdown-it = { version = "0.6.1", default-features = false }
markdown-it-footnote = "0.2"
mime_guess = "2"
percent-encoding = "2"
png = "0.18"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "html", "regex-fancy"] }
tempfile = "3"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }
